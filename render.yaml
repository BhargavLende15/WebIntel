# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, set GEMINI_API_KEY and update CORS_ORIGINS + VITE_API_URL to your live URLs.

services:
  - type: web
    name: webintel-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend.prod
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webintel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: webintel
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: webintel-db
    plan: free
    databaseName: webintel
    user: webintel
